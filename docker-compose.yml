name: saludamente-v2

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saludamente
      POSTGRES_PASSWORD: saludamente
      POSTGRES_DB: saludamente_v2
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saludamente -d saludamente_v2"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
